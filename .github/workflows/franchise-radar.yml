name: Franchise Radar

on:
  schedule:
    - cron: "17 13 * * 0-4"  # ~2am NZ, Mon-Fri. GitHub can delay scheduled runs by hours, so start early
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: franchise-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh brand universe
        run: python universe.py
      - name: Scan news sources
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python radar.py
      - name: Build prospect brief
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python pipeline.py
      - name: Save state and digest
        run: |
          git config user.name "franchise-radar"
          git config user.email "franchise-radar@users.noreply.github.com"
          git add state out
          git diff --cached --quiet || git commit -m "Franchise Radar $(date +%F)"
          git push
